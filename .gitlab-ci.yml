stages:
  - docker_build_and_push
  - build
  - test
  - fmt
  - clippy
  - examples
  - static_library
  - c_examples

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  CARGO_TERM_COLOR: always

.docker-build-template: &docker-build-template
  stage: docker_build_and_push
  image: docker:latest
  services:
  - docker:dind
  rules:
    - changes:
        - dockers/**/*
  before_script:
    - if [ -n "$DOCKERHUB_TOKEN" ]; then echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; fi

build-xtensa-esp32-rust-docker:
  <<: *docker-build-template
  script:
    - docker build -f ./dockers/xtensa-esp32/rust-dependencies/xtensa-esp32-rust.dockerfile -t $DOCKERHUB_USERNAME/xtensa-esp32-rust .
    - docker push $DOCKERHUB_USERNAME/xtensa-esp32-rust:latest

build-xtensa-esp32-c-docker:
  <<: *docker-build-template
  script:
    - docker build -f ./dockers/xtensa-esp32/c-dependencies/xtensa-esp32-c.dockerfile -t $DOCKERHUB_USERNAME/xtensa-esp32-c .
    - docker push $DOCKERHUB_USERNAME/xtensa-esp32-c:latest

build-risc-v-esp32c6-c-docker:
  <<: *docker-build-template
  script:
    - docker build -f ./dockers/risc-v-esp32c6/c-dependencies/risc-v-esp32c6-c.dockerfile -t $DOCKERHUB_USERNAME/risc-v-esp32c6-c .
    - docker push $DOCKERHUB_USERNAME/risc-v-esp32c6-c:latest

build-esp-c-docker:
  <<: *docker-build-template
  script:
    - docker build -f ./dockers/esp/esp.dockerfile -t $DOCKERHUB_USERNAME/esp-c .
    - docker push $DOCKERHUB_USERNAME/esp-c:latest

.base-template: &base-template
  image: ubuntu:latest
  before_script:
    - apt update && apt install -y curl build-essential lld
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH="${PATH}:/root/.cargo/bin"
    - rustup toolchain install nightly && rustup default 1.71
    - rustup target add mips64el-unknown-linux-gnuabi64
    - rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu

.container-template: &container-template
  before_script:
    - export PATH="${PATH}:/root/.cargo/bin"

.rust-template: &rust-template
  image: ubuntu:latest
  before_script:
    - apt update && apt install -y curl build-essential lld
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH="${PATH}:/root/.cargo/bin"

build:
  stage: build
  <<: *rust-template
  script:
    - cargo build --lib --verbose

test:
  stage: test
  <<: *rust-template
  script:
    - cargo test --verbose

fmt:
  stage: fmt
  <<: *rust-template
  script:
    - cargo fmt --all -- --check

clippy:
  stage: clippy
  <<: *rust-template
  script:
    - cargo clippy -- -D clippy::all

xtensa-esp32-rust-example-hello-world:
  stage: examples
  <<: *container-template
  image: arkhipovivan1/xtensa-esp32-rust:latest
  variables:
    CARGO_HOME: /root/.cargo
    RUSTUP_HOME: /root/.rustup
  script:
    - cd ./examples/rust-examples/xtensa-esp32/hello-world && . /root/export-esp.sh && cargo build
    - cd ./examples/rust-examples/xtensa-esp32/hello-world && cargo fmt --all -- --check

xtensa-esp32-rust-example-dynamic-memory:
  stage: examples
  <<: *container-template
  image: arkhipovivan1/xtensa-esp32-rust:latest
  variables:
    CARGO_HOME: /root/.cargo
    RUSTUP_HOME: /root/.rustup
  script:
    - cd ./examples/rust-examples/xtensa-esp32/dynamic-memory && . /root/export-esp.sh && cargo build
    - cd ./examples/rust-examples/xtensa-esp32/dynamic-memory && cargo fmt --all -- --check

xtensa-esp32-rust-example-timer:
  stage: examples
  <<: *container-template
  image: arkhipovivan1/xtensa-esp32-rust:latest
  variables:
    CARGO_HOME: /root/.cargo
    RUSTUP_HOME: /root/.rustup
  script:
    - cd ./examples/rust-examples/xtensa-esp32/timer && . /root/export-esp.sh && cargo build
    - cd ./examples/rust-examples/xtensa-esp32/timer && cargo fmt --all -- --check

xtensa-esp32-rust-example-wifi:
  stage: examples
  <<: *container-template
  image: arkhipovivan1/xtensa-esp32-rust:latest
  variables:
    CARGO_HOME: /root/.cargo
    RUSTUP_HOME: /root/.rustup
  script:
    - cd ./examples/rust-examples/xtensa-esp32/wifi && . /root/export-esp.sh && cargo build
    - cd ./examples/rust-examples/xtensa-esp32/wifi && cargo fmt --all -- --check

xtensa-esp32-rust-example-scheduler:
  stage: examples
  <<: *container-template
  image: arkhipovivan1/xtensa-esp32-rust:latest
  variables:
    CARGO_HOME: /root/.cargo
    RUSTUP_HOME: /root/.rustup
  script:
    - cd ./examples/rust-examples/xtensa-esp32/scheduler && . /root/export-esp.sh && cargo build
    - cd ./examples/rust-examples/xtensa-esp32/scheduler && cargo fmt --all -- --check

xtensa-esp32-static-library:
  stage: static_library
  <<: *container-template
  image: arkhipovivan1/xtensa-esp32-rust:latest
  variables:
    CARGO_HOME: /root/.cargo
    RUSTUP_HOME: /root/.rustup
  script:
    - cd ./c-library/xtensa-esp32 && . /root/export-esp.sh && cargo build --release
    - cd ./c-library/xtensa-esp32 && cargo fmt --all -- --check
  artifacts:
    paths:
      - c-library/xtensa-esp32/target/xtensa-esp32-none-elf/release/libxtensa_esp32_static_lib.a
    expire_in: 7 days

xtensa-esp32-c-example:
  stage: c_examples
  <<: *container-template
  image: arkhipovivan1/xtensa-esp32-c:latest
  variables:
    IDF_PATH: /root/esp/esp-idf
    IDF_TOOLS_PATH: /root/.espressif
  dependencies:
    - xtensa-esp32-static-library
  script:
    - cd ./examples/c-examples/xtensa-esp32 && . /root/esp/esp-idf/export.sh && make && esptool.py --chip esp32 elf2image --flash_mode="dio" --flash_freq "40m" --flash_size "4MB" -o main.bin main.elf

risc-v-esp32c6-rust-example-hello-world:
  stage: examples
  <<: *container-template
  image: arkhipovivan1/xtensa-esp32-rust:latest
  variables:
    CARGO_HOME: /root/.cargo
    RUSTUP_HOME: /root/.rustup
  script:
    - cd ./examples/rust-examples/risc-v-esp32-c6/hello-world && . /root/export-esp.sh && cargo build
    - cd ./examples/rust-examples/risc-v-esp32-c6/hello-world && cargo fmt --all -- --check

risc-v-esp32c6-rust-example-dynamic-memory:
  stage: examples
  <<: *container-template
  image: arkhipovivan1/xtensa-esp32-rust:latest
  variables:
    CARGO_HOME: /root/.cargo
    RUSTUP_HOME: /root/.rustup
  script:
    - cd ./examples/rust-examples/risc-v-esp32-c6/dynamic-memory && . /root/export-esp.sh && cargo build
    - cd ./examples/rust-examples/risc-v-esp32-c6/dynamic-memory && cargo fmt --all -- --check

risc-v-esp32c6-rust-example-timer:
  stage: examples
  <<: *container-template
  image: arkhipovivan1/xtensa-esp32-rust:latest
  variables:
    CARGO_HOME: /root/.cargo
    RUSTUP_HOME: /root/.rustup
  script:
    - cd ./examples/rust-examples/risc-v-esp32-c6/timer && . /root/export-esp.sh && cargo build
    - cd ./examples/rust-examples/risc-v-esp32-c6/timer && cargo fmt --all -- --check

risc-v-esp32c6-rust-example-wifi:
  stage: examples
  <<: *container-template
  image: arkhipovivan1/xtensa-esp32-rust:latest
  variables:
    CARGO_HOME: /root/.cargo
    RUSTUP_HOME: /root/.rustup
  script:
    - cd ./examples/rust-examples/risc-v-esp32-c6/wifi && . /root/export-esp.sh && cargo build
    - cd ./examples/rust-examples/risc-v-esp32-c6/wifi && cargo fmt --all -- --check

risc-v-esp32c6-static-library:
  stage: static_library
  <<: *container-template
  image: arkhipovivan1/xtensa-esp32-rust:latest
  variables:
    CARGO_HOME: /root/.cargo
    RUSTUP_HOME: /root/.rustup
  script:
    - cd ./c-library/risc-v-esp32-c6 && . /root/export-esp.sh && cargo build --release
    - cd ./c-library/risc-v-esp32-c6 && cargo fmt --all -- --check
  artifacts:
    paths:
      - c-library/risc-v-esp32-c6/target/riscv32imac-unknown-none-elf/release/librisc_v_esp32c6_static_lib.a
    expire_in: 7 days

risc-v-esp32c6-c-example:
  stage: c_examples
  <<: *container-template
  image: arkhipovivan1/risc-v-esp32c6-c:latest
  variables:
    IDF_PATH: /root/esp/esp-idf
    IDF_TOOLS_PATH: /root/.espressif
  dependencies:
    - risc-v-esp32c6-static-library
  script:
    - sed -i 's/0x4086E610/0x408629D0/' "$IDF_PATH/components/esp_system/ld/esp32c6/memory.ld.in"
    - cd ./examples/c-examples/risc-v-esp32c6 && . /root/esp/esp-idf/export.sh && make && esptool.py --chip esp32c6 elf2image --flash_mode="dio" --flash_freq "40m" --flash_size "4MB" -o main.bin main.elf

mips64-rust-example-hello-world:
  stage: examples
  <<: *base-template
  script:
    - cd ./examples/rust-examples/mips64/hello-world && cargo +nightly build --release
    - cd ./examples/rust-examples/mips64/hello-world && cargo +nightly fmt --all -- --check

mips64-rust-example-dynamic-memory:
  stage: examples
  <<: *base-template
  script:
    - cd ./examples/rust-examples/mips64/dynamic-memory && cargo +nightly build --release
    - cd ./examples/rust-examples/mips64/dynamic-memory && cargo +nightly fmt --all -- --check

mips64-rust-example-timer:
  stage: examples
  <<: *base-template
  script:
    - cd ./examples/rust-examples/mips64/timer && cargo +nightly build --release
    - cd ./examples/rust-examples/mips64/timer && cargo +nightly fmt --all -- --check

mips64-static-library:
  stage: static_library
  <<: *base-template
  script:
    - cd ./c-library/mips64 && cargo +nightly build --release
    - cd ./c-library/mips64 && cargo +nightly fmt --all -- --check
  artifacts:
    paths:
      - c-library/mips64/target/mips64el-unknown-linux-gnuabi64/release/libmips64_static_lib.a
    expire_in: 7 days

mips64-timer-tests:
  stage: test
  <<: *rust-template
  script:
    - cargo test -F mips64_timer_tests
